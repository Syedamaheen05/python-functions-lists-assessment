<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1410" width="760" height="1410" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Flow chart: Student Result Card Generator</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="270.0" y="22.0" width="140" height="36" rx="18.0" fill="#1e293b" stroke="#1e293b" stroke-width="2"/><text x="340" y="45.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Start</text><polygon points="204.0,92.0 490.0,92.0 476.0,148.0 190.0,148.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="340" y="116.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Input student name</text><text x="340" y="133.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1e3a8a">formatName(): strip() + title()</text><polygon points="204.0,180.0 490.0,180.0 476.0,230.0 190.0,230.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="340" y="210.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Input roll number</text><polygon points="340,263.0 460.0,305 340,347.0 220.0,305" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="340" y="301.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">Roll number</text><text x="340" y="318.5" text-anchor="middle" font-size="12" font-weight="400" fill="#4c1d95">isdigit()?</text><rect x="500.0" y="279.0" width="220" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="610" y="301.5" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Invalid roll number!</text><text x="610" y="318.5" text-anchor="middle" font-size="12" font-weight="400" fill="#7f1d1d">Use digits only.</text><polygon points="184.0,381.0 510.0,381.0 496.0,439.0 170.0,439.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="340" y="406.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Loop: input marks for each subject</text><text x="340" y="423.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1e3a8a">English, Mathematics, Computer, Physics, Chemistry</text><polygon points="340,478.0 470.0,520 340,562.0 210.0,520" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="340" y="516.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">Numeric and</text><text x="340" y="533.5" text-anchor="middle" font-size="12" font-weight="400" fill="#4c1d95">0 &lt;= marks &lt;= 100?</text><rect x="505.0" y="492.0" width="230" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="620" y="516.5" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Invalid input or range!</text><text x="620" y="533.5" text-anchor="middle" font-size="12" font-weight="400" fill="#7f1d1d">Ask again.</text><polygon points="340,588.0 470.0,630 340,672.0 210.0,630" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="340" y="626.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">More subjects</text><text x="340" y="643.5" text-anchor="middle" font-size="12" font-weight="400" fill="#4c1d95">left?</text><rect x="150.0" y="702.0" width="380" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="340" y="726.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">total = sum(subjectMarks)</text><text x="340" y="743.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">percentage = total / 500 x 100</text><rect x="120.0" y="787.0" width="440" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="340" y="811.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">getGrade(percentage)</text><text x="340" y="828.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">&gt;=90 A+  |  &gt;=80 A  |  &gt;=70 B  |  &gt;=60 C  |  &gt;=50 D  |  else Fail</text><polygon points="340,873.0 480.0,915 340,957.0 200.0,915" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="340" y="911.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">Any subject</text><text x="340" y="928.5" text-anchor="middle" font-size="12" font-weight="400" fill="#4c1d95">mark &lt; 40?</text><polygon points="340,988.0 480.0,1030 340,1072.0 200.0,1030" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="340" y="1035.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">Grade == Fail?</text><rect x="530.0" y="1002.0" width="200" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="630" y="1035.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Final Status = Fail</text><rect x="220.0" y="1113.0" width="240" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="340" y="1140.0" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Final Status = Pass</text><polygon points="164.0,1197.0 530.0,1197.0 516.0,1253.0 150.0,1253.0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="340" y="1221.5" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">displayResultCard()</text><text x="340" y="1238.5" text-anchor="middle" font-size="12" font-weight="400" fill="#14532d">name, roll, marks, total, %, grade, status</text><rect x="270.0" y="1294.0" width="140" height="36" rx="18.0" fill="#1e293b" stroke="#1e293b" stroke-width="2"/><text x="340" y="1317.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">End</text><polyline points="340,58 340,92" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polylin