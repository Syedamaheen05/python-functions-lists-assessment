<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Project overview: two tasks</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="20" width="470" height="420" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><path d="M20,32 a12,12 0 0 1 12,-12 h446 a12,12 0 0 1 12,12 v36 h-470 z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="255" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Task 1: Student Result Card Generator</text><text x="40" y="100" font-size="13" font-weight="700" fill="#2563eb">File</text><text x="120" y="100" font-size="13.5" fill="#1e293b">result_card_generator.py</text><line x1="35" y1="114" x2="475" y2="114" stroke="#e2e8f0"/><text x="40" y="152" font-size="13" font-weight="700" fill="#2563eb">Topic</text><text x="120" y="152" font-size="13.5" fill="#1e293b">Functions and String Manipulation</text><line x1="35" y1="166" x2="475" y2="166" stroke="#e2e8f0"/><text x="40" y="204" font-size="13" font-weight="700" fill="#2563eb">Input</text><text x="120" y="204" font-size="13.5" fill="#1e293b">Name, roll number and marks in 5 subjects</text><line x1="35" y1="218" x2="475" y2="218" stroke="#e2e8f0"/><text x="40" y="256" font-size="13" font-weight="700" fill="#2563eb">Rules</text><text x="120" y="256" font-size="13.5" fill="#1e293b">Marks 0-100  |  roll number digits only</text><text x="120" y="274" font-size="13.5" fill="#1e293b">Any subject below 40 = Fail</text><line x1="35" y1="288" x2="475" y2="288" stroke="#e2e8f0"/><text x="40" y="326" font-size="13" font-weight="700" fill="#2563eb">Output</text><text x="120" y="326" font-size="13.5" fill="#1e293b">Result card: total, percentage,</text><text x="120" y="344" font-size="13.5" fill="#1e293b">grade (A+ to Fail) and final status</text><line x1="35" y1="358" x2="475" y2="358" stroke="#e2e8f0"/><text x="40" y="396" font-size="13" font-weight="700" fill="#2563eb">Concepts</text><text x="120" y="396" font-size="13.5" fill="#1e293b">def, return, strip(), title(), isdigit(),</text><text x="120" y="414" font-size="13.5" fill="#1e293b">f-strings, zip()</text><rect x="510" y="20" width="470" height="420" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><path d="M510,32 a12,12 0 0 1 12,-12 h446 a12,12 0 0 1 12,12 v36 h-470 z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="745" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">Task 2: Class Marks Analyzer</text><text x="530" y="100" font-size="13" font-weight="700" fill="#7c3aed">File</text><text x="610" y="100" font-size="13.5" fill="#1e293b">class_marks_analyzer.py</text><line x1="525" y1="114" x2="965" y2="114" stroke="#e2e8f0"/><text x="530" y="152" font-size="13" font-weight="700" fill="#7c3aed">Topic</text><text x="610" y="152" font-size="13.5" fill="#1e293b">Lists and Loops</text><line x1="525" y1="166" x2="965" y2="166" stroke="#e2e8f0"/><text x="530" y="204" font-size="13" font-weight="700" fill="#7c3aed">Input</text><text x="610" y="204" font-size="13.5" fill="#1e293b">Class size, then name and marks per student</text><line x1="525" y1="218" x2="965" y2="218" stroke="#e2e8f0"/><text x="530" y="256" font-size="13" font-weight="700" fill="#7c3aed">Rules</text><text x="610" y="256" font-size="13.5" fill="#1e293b">Class size &gt; 0  |  marks 0-100</text><text x="610" y="274" font-size="13.5" fill="#1e293b">Pass at 50 or above, fail below 50</text><line x1="525" y1="288" x2="965" y2="288" stroke="#e2e8f0"/><text x="530" y="326" font-size="13" font-weight="700" fill="#7c3aed">Output</text><text x="610" y="326" font-size="13.5" fill="#1e293b">Average, highest/lowest with names, pass/fail</text><text x="610" y="344" font-size="13.5" fill="#1e293b">count, above-average list, sorted marks</text><line x1="525" y1="358" x2="965" y2="358" stroke="#e2e8f0"/><text x="530" y="396" font-size="13" font-weight="700" fill="#7c3aed">Concepts</text><text x="610" y="396" font-size="13.5" fill="#1e293b">append(), len(), sum(), max(), min(),</text><text x="610" y="414" font-size="13.5" fill="#1e293b">sorted(), for and while loops</text></svg>