<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1550" width="820" height="1550" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Flow chart: Class Marks Analyzer</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="340.0" y="22.0" width="140" height="36" rx="18.0" fill="#1e293b" stroke="#1e293b" stroke-width="2"/><text x="410" y="45.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Start</text><polygon points="254.0,89.0 580.0,89.0 566.0,141.0 240.0,141.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="410" y="120.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Input number of students</text><polygon points="410,173.0 540.0,215 410,257.0 280.0,215" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="410" y="211.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">Whole number</text><text x="410" y="228.5" text-anchor="middle" font-size="12" font-weight="400" fill="#4c1d95">and &gt; 0?</text><rect x="575.0" y="187.0" width="230" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="690" y="211.5" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Invalid number or input!</text><text x="690" y="228.5" text-anchor="middle" font-size="12" font-weight="400" fill="#7f1d1d">Ask again.</text><rect x="240.0" y="293.0" width="340" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="410" y="320.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">For each student 1 ... N</text><polygon points="254.0,367.0 580.0,367.0 566.0,423.0 240.0,423.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="410" y="391.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Input student name</text><text x="410" y="408.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1e3a8a">strip() + title()</text><polygon points="254.0,455.0 580.0,455.0 566.0,505.0 240.0,505.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="410" y="485.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Input marks</text><polygon points="410,533.0 540.0,575 410,617.0 280.0,575" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="410" y="571.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">Numeric and</text><text x="410" y="588.5" text-anchor="middle" font-size="12" font-weight="400" fill="#4c1d95">0 &lt;= marks &lt;= 100?</text><rect x="575.0" y="547.0" width="230" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="690" y="571.5" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Invalid input or range!</text><text x="690" y="588.5" text-anchor="middle" font-size="12" font-weight="400" fill="#7f1d1d">Ask again.</text><rect x="220.0" y="649.0" width="380" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="410" y="671.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">append() name and marks</text><text x="410" y="688.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">to studentNames / studentMarks</text><polygon points="410,733.0 540.0,775 410,817.0 280.0,775" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="410" y="771.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">More students</text><text x="410" y="788.5" text-anchor="middle" font-size="12" font-weight="400" fill="#4c1d95">left?</text><rect x="190.0" y="852.0" width="440" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="410" y="876.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">calculateClassAverage(), max(), min()</text><text x="410" y="893.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">average, highest and lowest marks</text><rect x="190.0" y="934.0" width="440" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="410" y="956.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">countPassFail()</text><text x="410" y="973.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">pass: 50 or above, fail: below 50</text><rect x="190.0" y="1014.0" width="440" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="410" y="1036.5" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">findStudentsWithMarks()</text><text x="410" y="1053.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">names for highest and lowest (ties included)</text><polygon points="234.0,1099.0 600.0,1099.0 586.0,1151.0 220.0,1151.0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="410" y="1130.0" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">displayClassSummary()</text><polygon points="410,1193.0 560.0,1235 410,1277.0 260.0,1235" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="410" y="1231.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">Any mark &gt;</text><text x="410" y="1248.5" text-anchor="middle" font-size="12" font-weight="400" fill="#4c1d95">class average?</text><rect x="615.0" y="1207.0" width="190" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="710" y="1231.5" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Print each student</text><text x="710" y="1248.5" text-anchor="middle" font-size="12" font-weight="400" fill="#14532d">above average</text><rect x="15.0" y="1207.0" width="190" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="110" y="1231.5" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">No students scored</text><text x="110" y="1248.5" text-anchor="middle" font-size="12" font-weight="400" fill="#78350f">above the average</text><polygon points="244.0,1332.0 590.0,1332.0 576.0,1388.0 230.0,1388.0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="410" y="1356.5" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">displaySortedMarks()</text><text x="410" y="1373.5" text-anchor="middle" font-size="12" font-weight="400" fill="#14532d">sorted(..., reverse=True)</text><rect x="340.0" y="1432.0" width="140" height="36" rx="18.0" fill="#1e293b" stroke="#1e293b" stroke-width="2"/><text x="410" y="1455.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">End</text><polyline points="410,58 410,89" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,141 410,173" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,257 410,293" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,337 410,367" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,423 410,455" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,505 410,533" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,617 410,649" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,701 410,733" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,817 410,852" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,908 410,934" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,986 410,1014" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,1066 410,1099" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,1151 410,1193" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="410,1388 410,1432" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="540,215 575,215" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="690,187 690,115 512,115" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="540,575 575,575" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="690,547 690,480 512,480" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" marker-end="url(#r)"/><polyline points="280,775 170,775 170,395 246,395" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="560,1235 615,1235" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="260,1235 205,1235" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="710,1263 710,1360 590,1360" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="110,1263 110,1360 232,1360" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/><text x="422" y="278" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Yes</text><text x="548" y="207" font-size="12" font-weight="700" fill="#dc2626" text-anchor="start">No</text><text x="422" y="642" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Yes</text><text x="548" y="567" font-size="12" font-weight="700" fill="#dc2626" text-anchor="start">No</text><text x="220" y="767" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Yes</text><text x="422" y="842" font-size="12" font-weight="700" fill="#dc2626" text-anchor="start">No</text><text x="578" y="1227" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Yes</text><text x="224" y="1226" font-size="12" font-weight="700" fill="#d97706" text-anchor="start">No</text><rect x="110.0" y="1488" width="18" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="134.0" y="1500" font-size="12" fill="#334155">Input</text><rect x="310.0" y="1488" width="18" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="334.0" y="1500" font-size="12" fill="#334155">Decision</text><rect x="510.0" y="1488" width="18" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="534.0" y="1500" font-size="12" fill="#334155">Output / success</text><rect x="110.0" y="1512" width="18" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="134.0" y="1524" font-size="12" fill="#334155">Error / rejection</text><rect x="310.0" y="1512" width="18" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="334.0" y="1524" font-size="12" fill="#334155">Warning</text><rect x="510.0" y="1512" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="534.0" y="1524" font-size="12" fill="#334155">Process</text></svg>